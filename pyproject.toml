[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roadrisk"
version = "0.1.0"
description = "Classifies a reported UK personal-injury collision as fatal or serious versus slight."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
# The base package and the dev extra stay usable on Python 3.10.
# The ml extra is pinned from the Python 3.12.10 environment used to train.
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
ml = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    # Phase 9 stores accepted predictions after scoring. Inference does not import it.
    "sqlalchemy>=2.0.36",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
